CONFIG_THREAD_NAME=y
CONFIG_DEBUG_THREAD_INFO=n

CONFIG_NO_OPTIMIZATIONS=n
CONFIG_DEBUG_OPTIMIZATIONS=y

CONFIG_STD_CPP20=y
CONFIG_NEWLIB_LIBC=y

# Console
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_PRINTK=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y

# Wi-Fi
CONFIG_WIFI=y
CONFIG_WIFI_ESP32=y

# Memory and stacks
CONFIG_HEAP_MEM_POOL_SIZE=98304
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=32
CONFIG_NET_BUF_TX_COUNT=32

# Logging
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BACKEND_SHOW_LEVEL=y
CONFIG_LOG_BACKEND_SHOW_TIMESTAMP=y

#Display
CONFIG_I2C=y
# CONFIG_DISPLAY=y
# CONFIG_SSD1306=y
# CONFIG_SSD1306_DEFAULT=y
# CONFIG_SSD1306_DEFAULT_CONTRAST=128

CONFIG_STATIC_INIT_GNU=y

#Downloader
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="${APP_DIR}/keys/firmware-signing-key.pem"

#AnDC
CONFIG_ADC=y

#Led
CONFIG_LED_STRIP=y
CONFIG_I2S=y
CONFIG_WS2812_STRIP_I2S=y